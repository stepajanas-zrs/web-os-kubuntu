<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hexagon - Logická Hra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        #info {
            margin-bottom: 20px;
            font-size: 1rem;
            color: #888;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
        #info strong { color: #ff0066; }
        #gameContainer {
            position: relative;
            width: 600px;
            height: 600px;
        }
        canvas {
            background: #0a0a0a;
            border: 2px solid #222;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            cursor: pointer;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            transition: opacity 0.3s;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px currentColor;
        }
        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ccc;
        }
        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }
        #stats {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #666;
        }
        #stats span { color: #ff0066; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Neon Hexagon</h1>
    <div id="info">
        Klikni na sousední hexagon pro aktivaci.<br>
        <strong>Pravidlo:</strong> Propojuj pouze <strong>stejné barvy</strong>.<br>
        Pokud klikneš na hexagon jiné barvy než má tvůj aktuální, <strong>prohraješ!</strong>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="overlay">
            <h2 style="color: #00ffcc;">Neon Hexagon</h2>
            <p>Logická hra s barvami</p>
