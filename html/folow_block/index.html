<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hexagon - Logická Hra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        #info {
            margin-bottom: 20px;
            font-size: 1rem;
            color: #888;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
        #info strong { color: #ff0066; }
        #gameContainer {
            position: relative;
            width: 600px;
            height: 600px;
        }
        canvas {
            background: #0a0a0a;
            border: 2px solid #222;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            cursor: pointer;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            transition: opacity 0.3s;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px currentColor;
        }
        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ccc;
        }
        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }
        #stats {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #666;
        }
        #stats span { color: #ff0066; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Neon Hexagon</h1>
    <div id="info">
        Klikni na sousední hexagon pro aktivaci.<br>
        <strong>Pravidlo:</strong> Propojuj pouze <strong>stejné barvy</strong>.<br>
        Pokud klikneš na hexagon jiné barvy než má tvůj aktuální, <strong>prohraješ!</strong>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width```html
="600">
        <div id="overlay">
            <h2 style="color: #00ffcc;">Neon Hexagon</h2>
            <p>Logická hra s barvami</p>
            <button id="startBtn">Spustit Hru</button>
        </div>
    </div>
    <div id="stats">
        Level: <span id="levelNum">1</span> | 
        Pohyby: <span id="movesNum">0</span> | 
        Skóre: <span id="scoreNum">0</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        const levelNumEl = document.getElementById('levelNum');
        const movesNumEl = document.getElementById('movesNum');
        const scoreNumEl = document.getElementById('scoreNum');

        // Barvy - světlé, dobře viditelné na tmavém pozadí
        const COLORS = [
            { name: 'red',    hex: '#ff4d6d' },
            { name: 'blue',   hex: '#4dc3ff' },
            { name: 'green',  hex: '#4dff88' },
            { name: 'yellow', hex: '#ffe14d' },
            { name: 'purple', hex: '#c77dff' },
            { name: 'orange', hex: '#ffa94d' }
        ];

        const HEX_SIZE = 26;      // poloměr hexagonu (vzdálenost střed -> vrchol)
        const GAP = 3;            // mezera mezi hexagony, aby se nepřekrývaly
        const SQRT3 = Math.sqrt(3);

        let hexGrid = [];
        let currentLevel = 1;
        let moves = 0;
        let score = 0;
        let gameActive = false;
        let animationId;
        let path = [];            // cesta aktivních hexagonů

        // ---------- HEX MATEMATIKA (axiální souřadnice) ----------
        function hexToPixel(q, r) {
            const x = (SQRT3 * q + SQRT3 / 2 * r) * HEX_SIZE;
            const y = (3 / 2 * r) * HEX_SIZE;
            return { x: x + canvas.width / 2, y: y + canvas.height / 2 };
        }

        function pixelToHex(px, py) {
            const x = px - canvas.width / 2;
            const y = py - canvas.height / 2;
            const q = (SQRT3 / 3 * x - 1 / 3 * y) / HEX_SIZE;
            const r = (2 / 3 * y) / HEX_SIZE;
            return hexRound(q, r);
        }

        function hexRound(q, r) {
            const s = -q - r;
            let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
            const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
            if (dq > dr && dq > ds) rq = -rr - rs;
            else if (dr > ds) rr = -rq - rs;
            return { q: rq, r: rr };
        }

        const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]];

        function areNeighbors(a, b) {
            return DIRS.some(([dq, dr]) => a.q + dq === b.q && a.r + dr === b.r);
        }

        function getHex(q, r) {
            return hexGrid.find(h => h.q === q && h.r === r);
        }

        // ---------- GENEROVÁNÍ LEVELU ----------
        // Generujeme BARVAMI SOUVISLÉ oblasti (pomocí náhodné procházky),
        // aby byl level vždy řešitelný.
        function generateLevel(level) {
            hexGrid = [];
            path = [];
            const maxDist = Math.min(2 + Math.floor(level / 2), 5);
            const numColors = Math.min(2 + Math.floor(level / 2), COLORS.length);

            // všechny buňky šestiúhelníkové desky
            const cells = [];
            for (let q = -maxDist; q <= maxDist; q++) {
                for (let r = -maxDist; r <= maxDist; r++) {
                    if (Math.abs(q + r) <= maxDist) cells.push({ q, r });
                }
            }

            // přiřazení barev – flood fill od náhodných semínek
            const colorOf = {};
            const unassigned = new Set(cells.map(c => c.q + ',' + c.r));
            let ci = 0;
            while (unassigned.size > 0) {
                const keys = [...unassigned];
                const seedKey = keys[Math.floor(Math.random() * keys.length)];
                const color = COLORS[ci % numColors];
                ci++;
                // BFS zasetí
                const queue = [seedKey];
                unassigned.delete(seedKey);
                while (queue.length) {
                    const k = queue.shift();
                    colorOf[k] = color;
                    const [q, r] = k.split(',').map(Number);
                    for (const [dq, dr] of DIRS) {
                        const nk = (q + dq) + ',' + (r + dr);
                        if (unassigned.has(nk)) {
                            unassigned.delete(nk);
                            queue.push(nk);
                        }
                    }
                }
            }

            // stav hry
            const center = hexToPixel(0, 0);
            cells.forEach(c => {
                const pos = hexToPixel(c.q, c.r);
                hexGrid.push({
                    q: c.q, r: c.r,
                    x: pos.x, y: pos.y,
                    color: colorOf[c.q + ',' + c.r],
                    active: c.q === 0 && c.r === 0
                });
            });

            path = [getHex(0, 0)];
        }

        // ---------- KRESLENÍ ----------
        function drawHex(x, y, size, fillColor, strokeColor, glow, lineWidth) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = Math.PI / 180 * (60 * i - 30);
                const hx = x + size * Math.cos(a);
                const hy = y + size * Math.sin(a);
                i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            if (glow) { ctx.shadowBlur = 18; ctx.shadowColor = glow; }
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = lineWidth || 2;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const head = path[path.length - 1];

            // čára spojující cestu
            if (path.length > 1) {
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            hexGrid.forEach(hex => {
                if (hex.active) {
                    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 250);
                    const isHead = head && hex.q === head.q && hex.r === head.r;
                    drawHex(hex.x, hex.y, HEX_SIZE - GAP,
                        hex.color.hex, '#ffffff', hex.color.hex, isHead ? 3 : 2);
                    if (isHead) {
                        ctx.beginPath();
                        ctx.arc(hex.x, hex.y, 5 + pulse * 3, 0, Math.PI * 2);
                        ctx.fillStyle = '#fff';
                        ctx.fill();
                    }
                } else {
                    // neaktivní – plná barva, ale tlumená
                    ctx.globalAlpha = 0.55;
                    drawHex(hex.x, hex.y, HEX_SIZE - GAP, hex.color.hex, '#0a0a0a', null, 2);
                    ctx.globalAlpha = 1;
                }
            });

            // náznak sousedů hlavy
            if (head) {
                DIRS.forEach(([dq, dr]) => {
                    const n = getHex(head.q + dq, head.r + dr);
                    if (n && !n.active) {
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, HEX_SIZE + 2, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                        ctx.setLineDash([4, 4]);
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
            }

            animationId = requestAnimationFrame(render);
        }

        // ---------- LOGIKA ----------
        function handleClick(e) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;

            const coords = pixelToHex(x, y);
            const hex = getHex(coords.q, coords.r);
            const head = path[path.length - 1];
            if (!hex || !head) return;

            // klik na předposlední článek cesty = krok zpět
            if (path.length > 1 && hex.q === path[path.length - 2].q && hex.r === path[path.length - 2].r) {
                head.active = false;
                path.pop();
                return;
            }

            if (hex.active) return;
            if (!areNeighbors(head, hex)) return;

            if (hex.color.name === head.color.name) {
                hex.active = true;
                path.push(hex);
                moves++;
                movesNumEl.textContent = moves;
                checkWin();
            } else {
                loseGame();
            }
        }

        function checkWin() {
            if (hexGrid.every(h => h.active)) {
                gameActive = false;
                cancelAnimationFrame(animationId);
                const bonus = Math.max(0, 100 - moves * 2);
                score += 100 + bonus;
                scoreNumEl.textContent = score;
                overlay.classList.remove('hidden');
                const h2 = overlay.querySelector('h2');
                h2.textContent = 'Level ' + currentLevel + ' Splněn! 🎉';
                h2.style.color = '#4dff88';
                overlay.querySelector('p').textContent = `Pohyby: ${moves} | Body: ${score}`;
                startBtn.textContent = 'Další Level';
            }
        }

        function loseGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            overlay.classList.remove('hidden');
            const h2 = overlay.querySelector('h2');
            h2.textContent = 'Špatná barva! 💥';
            h2.style.color = '#ff4d6d';
            overlay.querySelector('p').textContent = `Dosavadní skóre: ${score}`;
            startBtn.textContent = 'Zkusit Znovu';
        }

        function startGame() {
            if (startBtn.textContent.includes('Znovu')) {
                currentLevel = 1;
                score = 0;
                scoreNumEl.textContent = 0;
            } else {
                currentLevel++;
            }
            moves = 0;
            levelNumEl.textContent = currentLevel;
            movesNumEl.textContent = moves;

            generateLevel(currentLevel);
            gameActive = true;
            overlay.classList.add('hidden');
            if (animationId) cancelAnimationFrame(animationId);
            render();
        }

        canvas.addEventListener('click', handleClick);
        startBtn.addEventListener('click', startGame);

        // první nastavení pozadí (viditelné i před startem)
        generateLevel(1);
        render();
    </script>
</body>
</html>
