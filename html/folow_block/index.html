<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cesta barvou</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px;user-select:none}
  h1{font-size:1.5rem;letter-spacing:3px;margin-bottom:6px;
     background:linear-gradient(90deg,#ff5c7a,#ffd166,#4dd0e1,#8be27a);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  #sub{color:#8b949e;font-size:.85rem;margin-bottom:16px;text-align:center;max-width:520px;line-height:1.4}
  #hud{display:flex;gap:24px;margin-bottom:12px;font-size:.95rem;color:#8b949e}
  #hud b{color:#e6edf3}
  #board{display:grid;gap:5px;padding:12px;background:#161b22;border:1px solid #30363d;
         border-radius:14px;touch-action:none}
  .cell{width:56px;height:56px;border-radius:12px;background:#21262d;position:relative;cursor:pointer}
  .cell:hover{filter:brightness(1.2)}
  .cell svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .dot{position:absolute;inset:24%;border-radius:50%;z-index:2;box-shadow:0 0 12px currentColor}
  #controls{margin-top:16px;display:flex;gap:10px}
  button{background:#21262d;color:#e6edf3;border:1px solid #30363d;padding:9px 18px;
         border-radius:9px;cursor:pointer;font-size:.9rem}
  button:hover{background:#30363d}
  #msg{margin-top:12px;height:22px;font-weight:600}
  .win{color:#8be27a}.lose{color:#ff5c7a}
</style>
</head>
<body>
<h1>CESTA BARVOU</h1>
<div id="sub">Spojte dvě tečky stejné barvy čarou. Čáry se nesmí křížit a musí zaplnit celé pole.<br>
Klikni na tečku a táhni myší (nebo prstem).</div>
<div id="hud">Level <b id="lvl">1</b> &nbsp;|&nbsp; Zaplněno <b id="fill">0</b>%</div>
<div id="board"></div>
<div id="controls">
  <button id="resetBtn">↺ Reset</button>
  <button id="newBtn">Nový level</button>
</div>
<div id="msg"></div>

<script>
const COLORS=['#ff5c7a','#4dd0e1','#ffd166','#8be27a','#c792ea','#ff9f43'];
let N=4, level=1, endpoints=[], paths={}, dragging=null;
const boardEl=document.getElementById('board'), msgEl=document.getElementById('msg');
const K=(r,c)=>r+','+c;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function neighbors(c){return[{r:c.r-1,c:c.c},{r:c.r+1,c:c.c},{r:c.r,c:c.c-1},{r:c.r,c:c.c+1}]
  .filter(n=>n.r>=0&&n.r<N&&n.c>=0&&n.c<N);}

/* --- generování: rozdělit mřížku na souvislé hady (záruka řešitelnosti) --- */
function carve(){
  const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push({r,c});
  let best=null;
  for(let attempt=0;attempt<60;attempt++){
    const visited=new Set(), snakes=[];
    for(const start of shuffle(cells.slice())){
      if(visited.has(K(start.r,start.c)))continue;
      const path=[start]; visited.add(K(start.r,start.c));
      while(true){
        const head=path[path.length-1];
        const opts=shuffle(neighbors(head).filter(n=>!visited.has(K(n.r,n.c))));
        if(!opts.length)break;
        // necháme hada náhodně skončit, aby vzniklo víc hadů
        if(path.length>=2 && Math.random()<0.28)break;
        const n=opts[0]; visited.add(K(n.r,n.c)); path.push(n);
      }
      snakes.push(path);
    }
    if(snakes.length>=Math.max(3,N) && (!best||snakes.length>best.length)) best=snakes;
  }
  return best;
}

function generatePuzzle(){
  const snakes=carve();
  endpoints=[]; paths={};
  snakes.forEach((s,i)=>{
    const col=COLORS[i%COLORS.length];
    s.forEach(cell=>paths[K(cell.r,cell.c)]=col);
    endpoints.push({r:s[0].r,c:s[0].c,col});
    endpoints.push({r:s[s.length-1].r,c:s[s.length-1].c,col});
  });
  resetPlayerPaths();
}

function resetPlayerPaths(){
  paths={};
  endpoints.forEach(e=>paths[K(e.r,e.c)]=e.col);
  render();
}

/* --- vykreslení --- */
function render(){
  boardEl.style.gridTemplateColumns=`repeat(${N},56px)`;
  boardEl.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=document.createElement('div');
    cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
    const col=paths[K(r,c)];
    if(col){
      cell.style.background=col+'2e';
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 100 100');
      neighbors({r,c}).forEach(n=>{
        if(paths[K(n.r,n.c)]===col){
          const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
          ln.setAttribute('x1',50);ln.setAttribute('y1',50);
          ln.setAttribute('x2',50+(n.c-c)*50);ln.setAttribute('y2',50+(n.r-r)*50);
          ln.setAttribute('stroke',col);ln.setAttribute('stroke-width',28);
          ln.setAttribute('stroke-linecap','round');
          svg.appendChild(ln);
        }
      });
      cell.appendChild(svg);
      if(endpoints.some(e=>e.r===r&&e.c===c)){
        const dot=document.createElement('div');
        dot.className='dot'; dot.style.color=col; dot.style.background=col;
        cell.appendChild(dot);
      }
    }
    boardEl.appendChild(cell);
  }
  document.getElementById('fill').textContent=Math.round(Object.keys(paths).length/(N*N)*100);
}

/* --- ovládání tažením --- */
boardEl.addEventListener('pointerdown',e=>{
  const cell=e.target.closest('.cell'); if(!cell)return;
  e.preventDefault();
  dragging={head:{r:+cell.dataset.r,c:+cell.dataset.c}};
  step(dragging.head.r,dragging.head.c);
});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el&&el.closest?el.closest('.cell'):null;
  if(cell)step(+cell.dataset.r,+cell.dataset.c);
});
window.addEventListener('pointerup',()=>{dragging=null;checkWin();});

function step(r,c){
  if(!dragging)return;
  const k=K(r,c), hk=K(dragging.head.r,dragging.head.c);
  if(k===hk)return;
  if(Math.abs(r-dragging.head.r)+Math.abs(c-dragging.head.c)!==1)return;
  const col=paths[hk];
  if(paths[k]===undefined){                       // malování na prázdné políčko
    paths[k]=col; dragging.head={r,c}; render();
  } else if(paths[k]!==col){                      // přepis cizí barvy
    paths[k]=col; dragging.head={r,c}; render();
  }
}

function checkWin(){
  const full=Object.keys(paths).length===N*N;
  const ok=endpoints.every(e=>paths[K(e.r,e.c)]===e.col);
  if(full&&ok){
    msgEl.className='win'; msgEl.textContent='✓ Vyřešeno!';
    setTimeout(()=>{level++;document.getElementById('lvl').textContent=level;
      N=Math.min(4+Math.floor((level-1)/2),6);generatePuzzle();msgEl.textContent='';},1100);
  } else {
    msgEl.className='lose'; msgEl.textContent='Ještě ne – zkus to znovu.';
  }
}

document.getElementById('resetBtn').onclick=()=>{resetPlayerPaths();msgEl.textContent='';};
document.getElementById('newBtn').onclick=()=>{level++;document.getElementById('lvl').textContent=level;
  N=Math.min(4+Math.floor((level-1)/2),6);generatePuzzle();msgEl.textContent='';};

generatePuzzle();
</script>
</body>
</html>
