<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porovnávač textů</title>
<style>
  body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; padding: 25px 15px; margin: 0; }
  .box { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 780px; box-shadow: 0 10px 25px rgba(0,0,0,.5); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h2 { margin: 0; font-size: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  textarea { width: 100%; height: 150px; background: #0b1120; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; }
  textarea:focus { border-color: #38bdf8; }
  .res { background: #0b1120; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; max-height: 260px; overflow-y: auto; }
  .line { padding: 4px 8px; border-radius: 4px; margin-bottom: 3px; white-space: pre-wrap; word-break: break-all; }
  .same { color: #94a3b8; }
  .diff { background: rgba(245,158,11,.15); color: #fbbf24; border-left: 3px solid #f59e0b; }
  .add { background: rgba(16,185,129,.15); color: #34d399; border-left: 3px solid #10b981; }
  .del { background: rgba(239,68,68,.15); color: #f87171; border-left: 3px solid #ef4444; }
  .badge { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <h2>Porovnávač textů</h2>
    <span class="badge" id="stat">Shodné</span>
  </div>

  <div class="grid">
    <textarea id="t1" placeholder="Původní text..." oninput="diff()">První řádek textu
Druhý řádek beze změny
Třetí řádek původní</textarea>
    <textarea id="t2" placeholder="Nový text..." oninput="diff()">První řádek textu
Druhý řádek beze změny
Třetí řádek upravený
Čtvrtý přidaný řádek</textarea>
  </div>

  <div class="res" id="out"></div>
</div>

<script>
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function diff() {
    const a = document.getElementById('t1').value.split('\n');
    const b = document.getElementById('t2').value.split('\n');
    const max = Math.max(a.length, b.length);
    let html = '', diffs = 0;

    for (let i = 0; i < max; i++) {
      const l1 = a[i], l2 = b[i];
      if (l1 === l2) {
        html += `<div class="line same">${i + 1}: ${esc(l1 || ' ')}</div>`;
      } else if (l1 !== undefined && l2 !== undefined) {
        diffs++;
        html += `<div class="line diff">${i + 1}: − ${esc(l1)}<br>   + ${esc(l2)}</div>`;
      } else if (l1 === undefined) {
        diffs++;
        html += `<div class="line add">${i + 1}: + ${esc(l2)}</div>`;
      } else {
        diffs++;
        html += `<div class="line del">${i + 1}: − ${esc(l1)}</div>`;
      }
    }

    document.getElementById('out').innerHTML = html;
    document.getElementById('stat').textContent = diffs ? `Nalezeno rozdílů: ${diffs}` : 'Texty jsou zcela shodné';
    document.getElementById('stat').style.color = diffs ? '#fbbf24' : '#10b981';
  }

  diff();
</script>
</body>
</html>
