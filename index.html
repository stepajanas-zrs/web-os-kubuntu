<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kubuntu OS - KDE Plasma Web Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==========================================
       1. SDDM LOGIN SCREEN (PŘIHLAŠOVACÍ OBRAZOVKA)
       ========================================== -->
  <div id="login-screen" class="hidden">
    <form id="login-form">
      <div style="text-align: center; margin-bottom: 10px;">
        <span style="font-size: 3.5rem; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));">⚙️</span>
        <h2 style="margin: 10px 0 2px 0; font-size: 1.3rem; font-weight: 600;">Kubuntu Linux</h2>
        <p style="margin: 0; font-size: 0.8rem; color: var(--muted);">KDE Plasma 6.0 Session</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="username" style="font-size: 0.8rem; color: var(--muted);">Uživatel</label>
        <input type="text" id="username" placeholder="Uživatelské jméno" required autocomplete="username">
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="password" style="font-size: 0.8rem; color: var(--muted);">Heslo</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="login-error"></div>

      <button class="primary-btn" type="submit" style="font-weight: bold; margin-top: 6px; padding: 10px;">
        Přihlásit se
      </button>
      
      <div style="text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 4px;">
        Výchozí: stepan / janas
      </div>
    </form>
  </div>

  <!-- ==========================================
       2. HLAVNÍ PLOCHA (KUBUNTU PLASMA DESKTOP)
       ========================================== -->
  <main class="desktop hidden-on-login">
    <!-- Ikony na ploše (Dolphin, Kate, Discover + stažené programy) -->
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- Vrstva, do které JavaScript dynamicky generuje okna běžících aplikací -->
    <div id="windows-layer" class="windows-layer"></div>

    <!-- KDE Aplikační menu - Kickoff (skryté, otevírá se logem) -->
    <div id="start-menu" class="start-menu hidden"></div>
  </main>

  <!-- ==========================================
       3. SPODNÍ PANEL (KDE PLASMA PANEL)
       ========================================== -->
  <footer class="taskbar hidden-on-login">
    <!-- Spouštěcí tlačítko / Logo Kubuntu -->
    <button id="start-button" class="start-button" type="button" aria-label="Nabídka aplikací">
      <span style="filter: drop-shadow(0 0 4px rgba(61,174,233,0.6));">🌀</span>
    </button>

    <!-- Kontejner pro minimalizovaná a běžící okna aplikací -->
    <div id="taskbar-apps" class="taskbar-apps"></div>

    <!-- Systémová oblast (Tray vpravo - stav sítě, baterie a hodiny) -->
    <div class="tray">
      <span style="font-size: 0.95rem; cursor: pointer;" title="Připojení k síti">🌐</span>
      <span style="font-size: 0.95rem; cursor: pointer;" title="Hlasitost">🔊</span>
      <time id="clock" class="clock"></time>
    </div>
  </footer>

  <!-- Načtení kompletní řídící logiky operačního systému -->
  <script src="script.js"></script>
</body>
</html>
