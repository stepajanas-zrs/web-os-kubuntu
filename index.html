<!DOCTYPE html>
<html lang="cs">
<head>
  <!-- Přidejte tento řádek do <head> ve vašem index.html -->
<script src="calculator.js" defer></script>
<script src="script.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Web OS</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- SYSTÉMOVÝ LOCK SCREEN -->
  <div id="login-screen" class="hidden">
    <form id="login-form">
      <h2>Vítejte zpět</h2>
      <div id="login-error"></div>
      
      <div class="input-group">
        <label for="username">Uživatel</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      
      <div class="input-group">
        <label for="password">Heslo</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      
      <button class="primary-btn" type="submit" style="margin-top: 10px; padding: 12px;">Přihlásit se</button>
    </form>
  </div>

  <!-- PLOCHA SYSTÉMU -->
  <div class="desktop hidden-on-login">
    
    <!-- Dynamické ikony na ploše -->
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- Aktivní aplikační vrstva oken -->
    <div id="windows-layer" class="windows-layer"></div>

    <!-- Panel nabídky Start -->
    <div id="start-menu" class="start-menu hidden">
      <!-- Přidejte tento řádek do vašeho #start-menu v index.html -->
      <button class="menu-item" type="button" data-app="textbook">📚 Učebnice a Slovníky</button>
      <button class="menu-item" type="button" data-app="notepad">✎ Poznámkový blok</button>
      <button class="menu-item" type="button" data-app="files">📁 Správce souborů</button>
      <button class="menu-item" type="button" data-app="browser">🌐 Webový prohlížeč</button>
      <button class="menu-item" type="button" data-app="terminal">⌨ Systémový terminál</button>
      <button class="menu-item" type="button" data-app="calculator">🧮 Vědecká kalkulačka</button>
      <hr style="border: 0; border-top: 1px solid var(--panel-border); margin: 6px 0;">
      <button class="menu-item" type="button" data-action="logout" style="color: var(--danger);">🔒 Odhlásit se</button>
    </div>

  </div>

  <!-- HLAVNÍ SYSTEMOVÁ LIŠTA (DOCK) -->
  <footer class="taskbar hidden-on-login">
    <button id="start-button" class="start-button" type="button" aria-label="Start">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="color: #3b82f6;">
        <circle cx="12" cy="12" r="10" fill="rgba(59, 130, 246, 0.2)" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 7v10M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div id="taskbar-apps" class="taskbar-apps"></div>

    <div class="tray">
      <div id="clock">00:00</div>
    </div>
  </footer>

</body>
</html>
